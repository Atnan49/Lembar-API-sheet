<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Hard Brutal Drop Shadow -->
  <rect x="18" y="18" width="90" height="90" fill="#000000" />
  
  <!-- Main Sheet Container in Cyber Yellow -->
  <rect x="10" y="10" width="90" height="90" fill="#ffe600" stroke="#000000" stroke-width="6" />
  
  <!-- Sheet Header Divider -->
  <line x1="10" y1="40" x2="100" y2="40" stroke="#000000" stroke-width="6" />
  
  <!-- Header Bar Cells -->
  <rect x="18" y="18" width="18" height="14" fill="#000000" />
  <rect x="44" y="18" width="22" height="14" fill="#000000" />
  <rect x="74" y="18" width="18" height="14" fill="#000000" />
  
  <!-- Vertical Grid Divider -->
  <line x1="45" y1="40" x2="45" y2="100" stroke="#000000" stroke-width="6" />
  
  <!-- Horizontal Grid Divider -->
  <line x1="45" y1="70" x2="100" y2="70" stroke="#000000" stroke-width="6" />
  
  <!-- Left Side: Bold Letter "L" -->
  <path d="M22 50 V88 H38" stroke="#000000" stroke-width="7" stroke-linecap="square" />
  
  <!-- Right Side Top Cell: Fast API Lightning Flash -->
  <polygon points="65,46 86,46 72,62 89,62 57,86 64,66 52,66" fill="#000000" />
  
  <!-- Right Side Bottom Cell: REST API Dots -->
  <rect x="52" y="78" width="10" height="14" fill="#000000" />
  <rect x="68" y="78" width="10" height="14" fill="#000000" />
  <rect x="84" y="78" width="10" height="14" fill="#000000" />
</svg>
