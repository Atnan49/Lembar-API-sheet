<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Hard Brutal Drop Shadow -->
  <rect x="5" y="5" width="24" height="24" fill="#000000" />
  
  <!-- Main Yellow Sheet Badge -->
  <rect x="3" y="3" width="24" height="24" fill="#ffe600" stroke="#000000" stroke-width="2.5" />
  
  <!-- Sheet Grid Rows & Columns -->
  <!-- Top header row line -->
  <line x1="3" y1="11" x2="27" y2="11" stroke="#000000" stroke-width="2" />
  <!-- Vertical divider -->
  <line x1="12" y1="11" x2="12" y2="27" stroke="#000000" stroke-width="2" />
  <!-- Horizontal row line -->
  <line x1="12" y1="19" x2="27" y2="19" stroke="#000000" stroke-width="2" />
  
  <!-- Header Bar Accent -->
  <rect x="5.5" y="5.5" width="5" height="3.5" fill="#000000" />
  <rect x="13" y="5.5" width="5" height="3.5" fill="#000000" />
  <rect x="20.5" y="5.5" width="4.5" height="3.5" fill="#000000" />
  
  <!-- Bold "L" letter in bottom-left cell -->
  <path d="M6 14 v10 h4" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="square" />
  
  <!-- Lightning / API Arrow in bottom-right cell -->
  <polygon points="17,14 23,14 19,19 24,19 16,25 18,20 14,20" fill="#000000" />
</svg>
